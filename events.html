<!--
  FILE: events.html
  PAGE: Local Events Page
  URL:  generationsgetawayfl.com/events.html
  ============================================================
  PURPOSE:
    Shows local events near the property in Fort Lauderdale.
    Helps guests discover things to do during their stay.

  WHAT IS ON THIS PAGE:
    - Monthly calendar view with events shown on each day
    - Weekly drill-down view for more detail
    - Event list view
    - Filters: keyword, date, event type, source, radius
    - Event detail popup/modal when you click an event

  WHERE EVENTS COME FROM:
    - Manual events added by Kyle via the Admin Dashboard
    - Recurring events (Taco Tuesday, Farmers Market, etc.)
    - Future: Eventbrite, Ticketmaster, Google Events APIs

  CONNECTS TO:
    - /api/events      Fetches events from the database
    - /css/styles.css  Shared styles
    - /js/main.js      Shared scripts
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Local events near Generations Getaway LLC in Fort Lauderdale, FL — concerts, food, arts, festivals and more."/>
  <title>Local Events — Generations Getaway LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    /* ── Page Header ── */
    .page-header {
      padding: 7rem 4rem 4rem;
      background: linear-gradient(to bottom, var(--navy-deep), var(--navy));
      border-bottom: 1px solid rgba(46,95,163,0.2);
    }
    .page-header-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 2rem; flex-wrap: wrap;
    }
    .page-header h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 300; margin-bottom: 0.5rem;
    }
    .page-header h1 em { font-style: italic; color: var(--sky); }
    .page-header p { font-size: 0.85rem; color: var(--muted); }

    /* ── Filter Bar ── */
    .filter-bar {
      background: rgba(27,42,74,0.5);
      border-bottom: 1px solid rgba(46,95,163,0.2);
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(8px);
    }
    .filter-bar-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 1rem 4rem;
      display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
    }
    .filter-input {
      background: rgba(13,27,46,0.7);
      border: 1px solid rgba(91,141,217,0.25);
      color: var(--cream); padding: 0.6rem 1rem;
      font-family: var(--font-sans); font-size: 0.78rem;
      outline: none; border-radius: 3px;
      transition: border-color var(--transition);
    }
    .filter-input:focus { border-color: var(--blue-light); }
    .filter-input::placeholder { color: var(--muted); }
    .filter-select {
      background: rgba(13,27,46,0.7);
      border: 1px solid rgba(91,141,217,0.25);
      color: var(--cream); padding: 0.6rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.75rem;
      outline: none; border-radius: 3px; cursor: pointer;
      transition: border-color var(--transition);
    }
    .filter-select:focus { border-color: var(--blue-light); }
    .filter-select option { background: var(--navy-deep); }
    .filter-search { flex: 1; min-width: 200px; max-width: 280px; }
    .filter-date { width: 150px; }
    .filter-divider {
      width: 1px; height: 24px;
      background: rgba(91,141,217,0.2);
      flex-shrink: 0;
    }
    .filter-label {
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
      white-space: nowrap;
    }
    .filter-clear {
      background: none; border: 1px solid rgba(91,141,217,0.2);
      color: var(--muted); padding: 0.5rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 3px;
      transition: border-color var(--transition), color var(--transition);
    }
    .filter-clear:hover { border-color: var(--blue-light); color: var(--sky); }

    /* ── Main Layout ── */
    .events-layout {
      max-width: 100%; margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── View Toggle ── */
    .view-toggle {
      display: flex; gap: 0; margin-bottom: 2rem;
      border: 1px solid rgba(91,141,217,0.2);
      border-radius: 3px; overflow: hidden;
      align-self: flex-start; width: fit-content;
    }
    .view-btn {
      padding: 0.5rem 1.2rem;
      font-family: var(--font-sans); font-size: 0.68rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; background: transparent;
      border: none; color: var(--muted);
      transition: background var(--transition), color var(--transition);
    }
    .view-btn.active {
      background: rgba(46,95,163,0.25);
      color: var(--sky);
    }
    .view-btn + .view-btn {
      border-left: 1px solid rgba(91,141,217,0.2);
    }

    /* ── Calendar Section ── */
    .calendar-section { margin-bottom: 3rem; }

    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .cal-month-title {
      font-family: var(--font-serif);
      font-size: 1.8rem; font-weight: 300;
    }
    .cal-month-title em { font-style: italic; color: var(--sky); }
    .cal-nav { display: flex; gap: 0.5rem; align-items: center; }
    .cal-nav-btn {
      width: 34px; height: 34px; border-radius: 3px;
      background: rgba(46,95,163,0.12);
      border: 1px solid rgba(46,95,163,0.25);
      color: var(--sky); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: background var(--transition);
    }
    .cal-nav-btn:hover { background: rgba(46,95,163,0.3); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cal-today-btn {
      padding: 0 1rem; height: 34px; width: auto;
      font-size: 0.62rem; letter-spacing: 0.15em;
      font-family: var(--font-sans); text-transform: uppercase;
    }

    /* Month grid */
    .cal-grid-wrap {
      background: rgba(27,42,74,0.3);
      border: 1px solid rgba(46,95,163,0.2);
      border-radius: 4px; overflow: hidden;
      width: 100%; table-layout: fixed;
    }
    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      border-bottom: 1px solid rgba(46,95,163,0.15);
    }
    .cal-dow {
      text-align: center; padding: 0.7rem 0;
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
    }
    .cal-days-grid {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      table-layout: fixed;
    }
    .cal-day {
      height: 120px; min-height: unset; max-height: 120px;
      width: 100%; box-sizing: border-box;
      padding: 0.5rem; overflow: hidden;
      border-right: 1px solid rgba(46,95,163,0.1);
      border-bottom: 1px solid rgba(46,95,163,0.1);
      cursor: pointer; position: relative;
      transition: background var(--transition);
      word-break: break-word;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day:hover { background: rgba(46,95,163,0.08); }
    .cal-day.other-month { opacity: 0.3; pointer-events: none; }
    .cal-day.today .cal-day-num {
      background: var(--blue);
      color: white; border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-day.selected { background: rgba(46,95,163,0.15); }
    .cal-day-num {
      font-size: 0.78rem; color: rgba(164,196,224,0.7);
      margin-bottom: 0.3rem; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-day-events { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
    .cal-event-pill {
      padding: 1px 5px; border-radius: 2px;
      font-size: 0.6rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; line-height: 1.45;
      display: block;
    }
    .cal-event-pill:hover { opacity: 0.8; }
    .cal-more-btn {
      font-size: 0.6rem; color: var(--muted);
      background: none; border: none; cursor: pointer;
      padding: 1px 0; text-align: left;
      transition: color var(--transition);
    }
    .cal-more-btn:hover { color: var(--sky); }

    /* Weekly drill-down */
    .weekly-view { display: none; }
    .weekly-view.active { display: block; }
    .monthly-view.hidden { display: none; }

    .week-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1rem;
    }
    .back-to-month {
      background: none; border: 1px solid rgba(91,141,217,0.25);
      color: var(--muted); padding: 0.4rem 0.9rem;
      font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; font-family: var(--font-sans);
      transition: border-color var(--transition), color var(--transition);
    }
    .back-to-month:hover { border-color: var(--blue-light); color: var(--sky); }
    .week-title {
      font-family: var(--font-serif); font-size: 1.4rem; font-weight: 300;
    }
    .week-title em { font-style: italic; color: var(--sky); }

    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .week-day-col {
      background: rgba(27,42,74,0.3);
      border: 1px solid rgba(46,95,163,0.15);
      border-radius: 4px; overflow: hidden;
    }
    .week-day-header {
      padding: 0.7rem 0.6rem;
      border-bottom: 1px solid rgba(46,95,163,0.15);
      text-align: center;
    }
    .week-day-name {
      font-size: 0.6rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted);
    }
    .week-day-num {
      font-family: var(--font-serif); font-size: 1.2rem;
      font-weight: 300; color: var(--cream);
      line-height: 1.2;
    }
    .week-day-num.today {
      color: var(--sky); background: rgba(46,95,163,0.2);
      border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
    }
    .week-day-events {
      padding: 0.5rem; display: flex;
      flex-direction: column; gap: 3px;
      max-height: 280px; overflow-y: auto;
    }
    .week-day-events::-webkit-scrollbar { width: 3px; }
    .week-day-events::-webkit-scrollbar-track { background: transparent; }
    .week-day-events::-webkit-scrollbar-thumb { background: rgba(91,141,217,0.3); border-radius: 2px; }
    .week-event-item {
      padding: 0.35rem 0.5rem; border-radius: 3px;
      font-size: 0.65rem; line-height: 1.4;
      cursor: pointer; transition: opacity var(--transition);
    }
    .week-event-item:hover { opacity: 0.8; }
    .week-event-time { color: rgba(164,196,224,0.6); font-size: 0.6rem; }
    .week-event-name { color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Event type colors */
    .evt-music       { background: rgba(94,92,230,0.3);  border-left: 2px solid #5e5ce6; }
    .evt-food        { background: rgba(255,149,0,0.2);  border-left: 2px solid #ff9500; }
    .evt-arts        { background: rgba(255,45,85,0.2);  border-left: 2px solid #ff2d55; }
    .evt-sports      { background: rgba(52,199,89,0.2);  border-left: 2px solid #34c759; }
    .evt-family      { background: rgba(90,200,250,0.2); border-left: 2px solid #5ac8fa; }
    .evt-festivals   { background: rgba(255,214,10,0.2); border-left: 2px solid #ffd60a; }
    .evt-nightlife   { background: rgba(175,82,222,0.2); border-left: 2px solid #af52de; }
    .evt-community   { background: rgba(0,199,190,0.2);  border-left: 2px solid #00c7be; }
    .evt-holiday     { background: rgba(255,59,48,0.2);  border-left: 2px solid #ff3b30; }
    .evt-theater     { background: rgba(48,209,88,0.2);  border-left: 2px solid #30d158; }
    .evt-other       { background: rgba(142,142,147,0.2);border-left: 2px solid #8e8e93; }

    /* ── Event List ── */
    .list-section { margin-top: 3rem; }
    .list-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .list-title {
      font-family: var(--font-serif); font-size: 1.6rem; font-weight: 300;
    }
    .list-title em { font-style: italic; color: var(--sky); }
    .list-count {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.1em;
    }

    .event-list { display: flex; flex-direction: column; gap: 0; }

    .event-list-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 1.5rem; align-items: start;
      padding: 1.2rem 0;
      border-bottom: 1px solid rgba(46,95,163,0.12);
      transition: background var(--transition);
    }
    .event-list-item:hover { background: rgba(46,95,163,0.04); }
    .event-list-item:last-child { border-bottom: none; }

    .event-date-block { text-align: center; }
    .event-date-month {
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--blue-light);
    }
    .event-date-day {
      font-family: var(--font-serif); font-size: 2rem;
      font-weight: 300; line-height: 1; color: var(--cream);
    }
    .event-date-dow {
      font-size: 0.62rem; color: var(--muted);
    }

    .event-info { min-width: 0; }
    .event-name {
      font-family: var(--font-serif); font-size: 1.15rem;
      font-weight: 300; margin-bottom: 0.3rem; color: var(--cream);
    }
    .event-meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.72rem; color: var(--muted);
      margin-bottom: 0.5rem; align-items: center;
    }
    .event-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .event-type-badge {
      font-size: 0.58rem; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 0.15rem 0.5rem;
      border-radius: 2px;
    }
    .event-desc {
      font-size: 0.8rem; color: rgba(164,196,224,0.75);
      line-height: 1.7;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .event-desc.expanded {
      display: block; -webkit-line-clamp: unset;
    }
    .event-expand-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.68rem; color: var(--blue-light);
      padding: 0.2rem 0; letter-spacing: 0.1em;
      transition: color var(--transition); font-family: var(--font-sans);
    }
    .event-expand-btn:hover { color: var(--sky); }

    .event-actions { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }
    .event-ticket-btn {
      padding: 0.45rem 1rem;
      background: rgba(46,95,163,0.15);
      border: 1px solid rgba(46,95,163,0.3);
      color: var(--sky); font-family: var(--font-sans);
      font-size: 0.62rem; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; text-decoration: none;
      transition: background var(--transition);
      white-space: nowrap;
    }
    .event-ticket-btn:hover { background: rgba(46,95,163,0.3); }
    .event-source-tag {
      font-size: 0.58rem; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .event-price {
      font-size: 0.72rem; color: var(--sky);
      font-family: var(--font-serif);
    }

    /* ── Day Detail Popup ── */
    .day-popup-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(8,15,26,0.8); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 2rem;
    }
    .day-popup-overlay.open { display: flex; }
    .day-popup {
      background: var(--navy);
      border: 1px solid rgba(91,141,217,0.25);
      border-radius: 4px; width: 100%; max-width: 520px;
      max-height: 80vh; overflow-y: auto;
    }
    .day-popup-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(46,95,163,0.15);
      position: sticky; top: 0; background: var(--navy);
    }
    .day-popup-title {
      font-family: var(--font-serif); font-size: 1.2rem; font-weight: 300;
    }
    .day-popup-close {
      background: none; border: 1px solid rgba(91,141,217,0.2);
      color: var(--muted); width: 28px; height: 28px;
      cursor: pointer; border-radius: 3px; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: border-color var(--transition), color var(--transition);
    }
    .day-popup-close:hover { border-color: var(--blue-light); color: var(--sky); }
    .day-popup-body { padding: 1rem 1.5rem; }
    .day-popup-event {
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(46,95,163,0.1);
    }
    .day-popup-event:last-child { border-bottom: none; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted); font-size: 0.85rem;
      line-height: 1.8;
    }
    .empty-state-icon { font-size: 2.5rem; margin-bottom: 1rem; }

    /* ── Loading ── */
    .loading-state {
      text-align: center; padding: 3rem;
      color: var(--muted); font-size: 0.82rem;
    }

    /* ══════════════════════════════════
       RESPONSIVE — TABLET (≤900px)
       ══════════════════════════════════ */
    @media (max-width: 900px) {
      .page-header { padding: 6rem 1.5rem 2.5rem; }
      .filter-bar-inner { padding: 0.7rem 1.5rem; gap: 0.5rem; }
      .filter-search { min-width: 140px; }
      .events-layout { padding: 1.2rem 1.5rem 4rem; }

      /* Compact calendar cells on tablet */
      .cal-day { min-height: 80px; padding: 0.3rem; }
      .cal-day-num { font-size: 0.72rem; }
      .cal-event-pill { font-size: 0.58rem; }

      /* Week view: show 4 days */
      .week-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }

      /* Event list: hide actions column */
      .event-list-item { grid-template-columns: 70px 1fr; gap: 1rem; }
      .event-actions { display: none; }
    }

    /* ══════════════════════════════════
       RESPONSIVE — MOBILE (≤640px)
       ══════════════════════════════════ */
    @media (max-width: 640px) {
      .page-header { padding: 5.5rem 1.2rem 2rem; }
      .page-header h1 { font-size: 2rem; }

      /* Filter bar: wrap to 2 rows, full-width selects */
      .filter-bar-inner { flex-wrap: wrap; }
      .filter-search { min-width: 100%; order: -1; }
      .filter-date { width: 130px; }
      .filter-divider { display: none; }
      .filter-select { flex: 1; min-width: 0; font-size: 0.7rem; padding: 0.5rem 0.5rem; }
      .filter-clear { margin-left: auto; }

      /* Active filter tags — scrollable row */
      #activeFilterTags { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.2rem; }

      /* Calendar: very compact cells */
      .cal-day { min-height: 60px; padding: 0.25rem; }
      .cal-day-num { font-size: 0.68rem; width: 20px; height: 20px; }
      .cal-event-pill { font-size: 0.55rem; padding: 1px 3px; }
      .cal-more-btn { font-size: 0.55rem; }
      .cal-dow { font-size: 0.55rem; padding: 0.4rem 0; }

      /* Week view: show 3 days at a time with horizontal scroll */
      .week-grid {
        grid-template-columns: repeat(7, minmax(120px, 1fr));
        overflow-x: auto; gap: 4px;
        padding-bottom: 0.5rem;
        /* Scrollbar styling */
        scrollbar-width: thin;
        scrollbar-color: rgba(91,141,217,0.3) transparent;
      }
      .week-grid::-webkit-scrollbar { height: 4px; }
      .week-grid::-webkit-scrollbar-track { background: transparent; }
      .week-grid::-webkit-scrollbar-thumb { background: rgba(91,141,217,0.3); border-radius: 2px; }

      /* Event list: compact 2-col */
      .event-list-item {
        grid-template-columns: 56px 1fr;
        gap: 0.8rem; padding: 1rem 0;
      }
      .event-date-day { font-size: 1.6rem; }
      .event-date-month { font-size: 0.55rem; }
      .event-name { font-size: 1rem; }
      .event-meta { gap: 0.5rem; font-size: 0.68rem; }
      .event-actions { display: none; }

      /* Day popup: bottom sheet on mobile */
      .day-popup-overlay { align-items: flex-end; padding: 0; }
      .day-popup {
        max-width: 100%; width: 100%;
        border-radius: 12px 12px 0 0;
        max-height: 75vh;
      }

      /* View toggle and header row */
      .view-toggle { width: 100%; }
      .view-btn { flex: 1; text-align: center; }

      /* Calendar header */
      .cal-month-title { font-size: 1.4rem; }
      .cal-header { margin-bottom: 1rem; }

      /* List section */
      .list-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav id="navbar" role="navigation" aria-label="Main navigation">
    <a href="/index.html" class="nav-logo-wrap" aria-label="Generations Getaway LLC — Home">
      <img class="nav-logo-img" src="https://raw.githubusercontent.com/TheDataJockey/generations-getaway/main/assets/logo.png" alt="Generations Getaway LLC Logo"/>
