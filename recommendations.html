<!--
  FILE: recommendations.html
  PAGE: Explore / Local Recommendations Page
  URL:  generationsgetawayfl.com/recommendations.html
  ============================================================
  PURPOSE:
    Shows handpicked local recommendations near the property.
    Restaurants, bars, beaches, shopping, spas and more.
    All recommendations are managed by Kyle via the Admin Dashboard.

  WHAT IS ON THIS PAGE:
    - Grid view of recommendation cards (default)
    - List view option
    - Category pills (Dining, Bars, Beaches, Shopping, etc.)
    - Filters: keyword search, price range, distance, sort
    - Detail modal popup with address, phone, hours, map link
    - Featured section for top picks

  CONNECTS TO:
    - /api/recommendations  Fetches places from the database
    - /css/styles.css       Shared styles
    - /js/main.js           Shared scripts
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Local recommendations near Generations Getaway LLC in Fort Lauderdale, FL — restaurants, beaches, nightlife, shopping and more."/>
  <title>Explore Fort Lauderdale — Generations Getaway LLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    /* ── Page Header ── */
    .page-header {
      padding: 7rem 4rem 4rem;
      background: linear-gradient(to bottom, var(--navy-deep), var(--navy));
      border-bottom: 1px solid rgba(46,95,163,0.2);
    }
    .page-header-inner {
      max-width: 1200px; margin: 0 auto;
    }
    .page-header h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 300; margin-bottom: 0.5rem;
    }
    .page-header h1 em { font-style: italic; color: var(--sky); }
    .page-header p { font-size: 0.85rem; color: var(--muted); }

    /* ── Filter Bar ── */
    .filter-bar {
      background: rgba(27,42,74,0.5);
      border-bottom: 1px solid rgba(46,95,163,0.2);
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(8px);
    }
    .filter-bar-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 1rem 4rem;
      display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
    }
    .filter-input {
      background: rgba(13,27,46,0.7);
      border: 1px solid rgba(91,141,217,0.25);
      color: var(--cream); padding: 0.6rem 1rem;
      font-family: var(--font-sans); font-size: 0.78rem;
      outline: none; border-radius: 3px;
      transition: border-color var(--transition);
      flex: 1; min-width: 180px; max-width: 280px;
    }
    .filter-input:focus { border-color: var(--blue-light); }
    .filter-input::placeholder { color: var(--muted); }
    .filter-select {
      background: rgba(13,27,46,0.7);
      border: 1px solid rgba(91,141,217,0.25);
      color: var(--cream); padding: 0.6rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.75rem;
      outline: none; border-radius: 3px; cursor: pointer;
      transition: border-color var(--transition);
    }
    .filter-select:focus { border-color: var(--blue-light); }
    .filter-select option { background: var(--navy-deep); }
    .filter-divider {
      width: 1px; height: 24px;
      background: rgba(91,141,217,0.2); flex-shrink: 0;
    }
    .filter-clear {
      background: none; border: 1px solid rgba(91,141,217,0.2);
      color: var(--muted); padding: 0.5rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 3px;
      transition: border-color var(--transition), color var(--transition);
    }
    .filter-clear:hover { border-color: var(--blue-light); color: var(--sky); }

    /* ── Category Pills ── */
    .category-strip {
      max-width: 1200px; margin: 0 auto;
      padding: 1.2rem 4rem 0;
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    .cat-pill {
      padding: 0.35rem 0.9rem; border-radius: 100px;
      border: 1px solid rgba(91,141,217,0.2);
      background: transparent; color: var(--muted);
      font-family: var(--font-sans); font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; white-space: nowrap;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .cat-pill:hover { border-color: var(--blue-light); color: var(--sky); }
    .cat-pill.active {
      background: rgba(46,95,163,0.25);
      border-color: var(--blue-light); color: var(--sky);
    }

    /* ── Main Layout ── */
    .recs-layout {
      max-width: 1200px; margin: 0 auto;
      padding: 2.5rem 4rem 5rem;
    }

    /* ── Results count ── */
    .results-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.8rem;
    }
    .results-count {
      font-size: 0.78rem; color: var(--muted); letter-spacing: 0.1em;
    }
    .results-count strong { color: var(--sky); }

    /* ── View toggle ── */
    .view-toggle {
      display: flex; gap: 0; border: 1px solid rgba(91,141,217,0.2);
      border-radius: 3px; overflow: hidden;
    }
    .view-btn {
      padding: 0.4rem 0.9rem;
      font-family: var(--font-sans); font-size: 0.7rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; background: transparent;
      border: none; color: var(--muted);
      transition: background var(--transition), color var(--transition);
    }
    .view-btn.active { background: rgba(46,95,163,0.25); color: var(--sky); }
    .view-btn + .view-btn { border-left: 1px solid rgba(91,141,217,0.2); }

    /* ── Grid View ── */
    .recs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .rec-card {
      background: rgba(27,42,74,0.4);
      border: 1px solid rgba(91,141,217,0.18);
      border-radius: 4px; overflow: hidden;
      transition: border-color var(--transition), transform var(--transition);
      display: flex; flex-direction: column;
    }
    .rec-card:hover { border-color: rgba(91,141,217,0.4); transform: translateY(-3px); }

    .rec-card-img {
      width: 100%; height: 180px; object-fit: cover;
      background: rgba(27,42,74,0.6); flex-shrink: 0;
    }
    .rec-card-img-placeholder {
      width: 100%; height: 180px;
      background: rgba(27,42,74,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; flex-shrink: 0;
    }
    .rec-card-body { padding: 1.3rem; flex: 1; display: flex; flex-direction: column; }
    .rec-card-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .rec-card-name {
      font-family: var(--font-serif); font-size: 1.15rem;
      font-weight: 300; color: var(--cream); line-height: 1.3;
      flex: 1;
    }
    .rec-card-rating {
      font-size: 0.75rem; color: #FFD54F;
      white-space: nowrap; flex-shrink: 0;
    }
    .rec-card-meta {
      display: flex; gap: 0.7rem; flex-wrap: wrap;
      font-size: 0.7rem; color: var(--muted);
      margin-bottom: 0.6rem; align-items: center;
    }
    .rec-card-meta span { display: flex; align-items: center; gap: 0.2rem; }
    .price-range { color: #81C784; font-weight: 500; }
    .rec-card-desc {
      font-size: 0.78rem; color: rgba(164,196,224,0.75);
      line-height: 1.7; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 0.8rem;
    }
    .rec-card-desc.expanded {
      display: block; -webkit-line-clamp: unset;
    }
    .rec-card-footer {
      display: flex; gap: 0.6rem; align-items: center;
      margin-top: auto; flex-wrap: wrap;
    }
    .rec-link-btn {
      padding: 0.4rem 0.9rem;
      background: rgba(46,95,163,0.15);
      border: 1px solid rgba(46,95,163,0.3);
      color: var(--sky); font-family: var(--font-sans);
      font-size: 0.62rem; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; text-decoration: none;
      transition: background var(--transition); white-space: nowrap;
    }
    .rec-link-btn:hover { background: rgba(46,95,163,0.3); }
    .rec-expand-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.65rem; color: var(--muted);
      font-family: var(--font-sans); padding: 0;
      transition: color var(--transition);
    }
    .rec-expand-btn:hover { color: var(--sky); }
    .rec-category-badge {
      font-size: 0.58rem; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 0.15rem 0.5rem;
      border-radius: 2px; margin-left: auto;
    }

    /* ── List View ── */
    .recs-list { display: flex; flex-direction: column; gap: 0; }
    .rec-list-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 1.5rem; padding: 1.3rem 0;
      border-bottom: 1px solid rgba(46,95,163,0.12);
      align-items: start;
      transition: background var(--transition);
    }
    .rec-list-item:hover { background: rgba(46,95,163,0.04); }
    .rec-list-item:last-child { border-bottom: none; }
    .rec-list-img {
      width: 120px; height: 90px; object-fit: cover;
      border-radius: 3px; flex-shrink: 0;
      background: rgba(27,42,74,0.6);
    }
    .rec-list-img-placeholder {
      width: 120px; height: 90px; border-radius: 3px;
      background: rgba(27,42,74,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
    }
    .rec-list-info { min-width: 0; }
    .rec-list-name {
      font-family: var(--font-serif); font-size: 1.2rem;
      font-weight: 300; color: var(--cream);
      margin-bottom: 0.3rem;
    }
    .rec-list-meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.72rem; color: var(--muted);
      margin-bottom: 0.5rem; align-items: center;
    }
    .rec-list-desc {
      font-size: 0.8rem; color: rgba(164,196,224,0.75);
      line-height: 1.7;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .rec-list-desc.expanded { display: block; }
    .rec-list-actions { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; }

    /* ── Featured section ── */
    .featured-section { margin-bottom: 2.5rem; }
    .featured-label {
      font-size: 0.6rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--gold, #C9A84C);
      margin-bottom: 0.8rem; display: block;
    }
    .featured-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem;
    }
    .featured-card {
      position: relative; border-radius: 4px; overflow: hidden;
      height: 220px; cursor: pointer;
    }
    .featured-card img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }
    .featured-card:hover img { transform: scale(1.05); }
    .featured-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(13,27,46,0.9) 0%, transparent 60%);
      padding: 1.2rem;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .featured-card-name {
      font-family: var(--font-serif); font-size: 1.2rem;
      font-weight: 300; color: white; margin-bottom: 0.2rem;
    }
    .featured-card-cat { font-size: 0.65rem; color: var(--sky); letter-spacing: 0.15em; text-transform: uppercase; }

    /* ── Category section headers ── */
    .category-section { margin-bottom: 3rem; }
    .category-section-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(46,95,163,0.2);
    }
    .category-section-icon { font-size: 1.4rem; }
    .category-section-title {
      font-family: var(--font-serif); font-size: 1.6rem; font-weight: 300;
    }
    .category-section-title em { font-style: italic; color: var(--sky); }
    .category-section-count {
      font-size: 0.7rem; color: var(--muted);
      margin-left: auto; letter-spacing: 0.1em;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted); font-size: 0.85rem; line-height: 1.8;
    }
    .empty-state-icon { font-size: 2.5rem; margin-bottom: 1rem; }

    /* ── Detail Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(8,15,26,0.85); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--navy); border: 1px solid rgba(91,141,217,0.25);
      border-radius: 4px; width: 100%; max-width: 600px;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(91,141,217,0.15);
      position: sticky; top: 0; background: var(--navy); z-index: 1;
    }
    .modal-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 300; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 3px;
      background: none; border: 1px solid rgba(91,141,217,0.2);
      color: var(--muted); cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: border-color var(--transition), color var(--transition);
    }
    .modal-close:hover { border-color: var(--blue-light); color: var(--sky); }
    .modal-img { width: 100%; height: 220px; object-fit: cover; }
    .modal-body { padding: 1.5rem 2rem 2rem; }
    .modal-meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 1rem; align-items: center;
    }
    .modal-desc {
      font-size: 0.85rem; color: rgba(164,196,224,0.85);
      line-height: 1.8; margin-bottom: 1.2rem;
    }
    .modal-info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .modal-info-item label {
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--blue-light);
      display: block; margin-bottom: 0.2rem;
    }
    .modal-info-item span { font-size: 0.82rem; color: var(--cream); }
    .modal-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; }

    /* ── Category color map ── */
    .cat-restaurants  { border-left: 3px solid #ff9500; }
    .cat-bars         { border-left: 3px solid #af52de; }
    .cat-coffee       { border-left: 3px solid #c49a6c; }
    .cat-beaches      { border-left: 3px solid #5ac8fa; }
    .cat-shopping     { border-left: 3px solid #ff2d55; }
    .cat-spas         { border-left: 3px solid #34c759; }
    .cat-museums      { border-left: 3px solid #ff3b30; }
    .cat-theater      { border-left: 3px solid #30d158; }
    .cat-water_sports { border-left: 3px solid #0a84ff; }
    .cat-family       { border-left: 3px solid #ffd60a; }
    .cat-other        { border-left: 3px solid #8e8e93; }

    .badge-restaurants  { background: rgba(255,149,0,0.2);   color: #ff9500; }
    .badge-bars         { background: rgba(175,82,222,0.2);  color: #af52de; }
    .badge-coffee       { background: rgba(196,154,108,0.2); color: #c49a6c; }
    .badge-beaches      { background: rgba(90,200,250,0.2);  color: #5ac8fa; }
    .badge-shopping     { background: rgba(255,45,85,0.2);   color: #ff2d55; }
    .badge-spas         { background: rgba(52,199,89,0.2);   color: #34c759; }
    .badge-museums      { background: rgba(255,59,48,0.2);   color: #ff3b30; }
    .badge-theater      { background: rgba(48,209,88,0.2);   color: #30d158; }
    .badge-water_sports { background: rgba(10,132,255,0.2);  color: #0a84ff; }
    .badge-family       { background: rgba(255,214,10,0.2);  color: #ffd60a; }
    .badge-other        { background: rgba(142,142,147,0.2); color: #8e8e93; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .page-header { padding: 6rem 1.5rem 2.5rem; }
      .filter-bar-inner { padding: 0.8rem 1.5rem; }
      .category-strip { padding: 1rem 1.5rem 0; }
      .recs-layout { padding: 1.5rem 1.5rem 4rem; }
      .featured-grid { grid-template-columns: 1fr 1fr; }
      .recs-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      .rec-list-item { grid-template-columns: 100px 1fr; }
      .rec-list-actions { display: none; }
    }
    @media (max-width: 640px) {
      .page-header { padding: 5.5rem 1.2rem 2rem; }
      .filter-bar-inner { flex-wrap: wrap; }
      .filter-input { min-width: 100%; max-width: 100%; order: -1; }
      .filter-divider { display: none; }
      .filter-select { flex: 1; font-size: 0.7rem; padding: 0.5rem 0.5rem; }
      .category-strip { padding: 0.8rem 1.2rem 0; gap: 0.4rem; }
      .cat-pill { font-size: 0.62rem; padding: 0.3rem 0.7rem; }
      .recs-layout { padding: 1.2rem 1.2rem 4rem; }
      .featured-grid { grid-template-columns: 1fr; }
      .featured-card { height: 180px; }
      .recs-grid { grid-template-columns: 1fr; }
      .rec-list-item { grid-template-columns: 80px 1fr; gap: 0.8rem; }
      .rec-list-img, .rec-list-img-placeholder { width: 80px; height: 70px; }
      .rec-list-name { font-size: 1rem; }
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal { border-radius: 12px 12px 0 0; max-height: 85vh; max-width: 100%; }
      .modal-info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav id="navbar" role="navigation" aria-label="Main navigation">
    <a href="/index.html" class="nav-logo-wrap" aria-label="Generations Getaway LLC — Home">
      <img class="nav-logo-img" src="https://raw.githubusercontent.com/TheDataJockey/generations-getaway/main/assets/logo.png" alt="Generations Getaway LLC Logo"/>
      <span class="nav-logo-text">Generations Getaway</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks" role="list">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/events.html">Events</a></li>
      <li><a href="/recommendations.html" class="active">Explore</a></li>
      <li><a href="/welcome.html">Guest Portal</a></li>
      <li><a href="/booking.html" class="nav-cta">Book Now</a></li>
    </ul>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <div class="page-header-inner">
      <span class="section-label">Fort Lauderdale, FL</span>
      <h1>Explore <em>Local</em></h1>
      <p>Handpicked recommendations from Generations Getaway LLC — the best of Fort Lauderdale near you</p>
    </div>
  </header>

  <!-- FILTER BAR -->
  <div class="filter-bar" role="search" aria-label="Recommendation filters">
    <div class="filter-bar-inner">
      <input type="text" id="searchInput" class="filter-input"
        placeholder="&#128269; Search places..." aria-label="Search recommendations"/>
      <div class="filter-divider" aria-hidden="true"></div>
      <select id="priceFilter" class="filter-select" aria-label="Filter by price range">
        <option value="">Any Price</option>
        <option value="$">$ — Budget</option>
        <option value="$$">$$ — Moderate</option>
        <option value="$$$">$$$ — Upscale</option>
        <option value="$$$$">$$$$ — Luxury</option>
      </select>
      <select id="distanceFilter" class="filter-select" aria-label="Filter by distance">
        <option value="">Any Distance</option>
        <option value="5">Within 5 min</option>
        <option value="15">Within 15 min</option>
        <option value="30">Within 30 min</option>
      </select>
      <select id="sortFilter" class="filter-select" aria-label="Sort results">
        <option value="rating">Top Rated</option>
        <option value="distance">Nearest First</option>
        <option value="name">A–Z</option>
      </select>
      <div class="filter-divider" aria-hidden="true"></div>
      <button class="filter-clear" id="clearFilters">Clear</button>
    </div>
  </div>

  <!-- CATEGORY PILLS -->
  <div class="category-strip" role="group" aria-label="Filter by category" id="categoryStrip">
    <button class="cat-pill active" data-cat="" aria-pressed="true">All</button>
    <button class="cat-pill" data-cat="restaurants_dining" aria-pressed="false">🍽 Dining</button>
    <button class="cat-pill" data-cat="bars_nightlife"     aria-pressed="false">🍸 Bars &amp; Nightlife</button>
    <button class="cat-pill" data-cat="coffee_cafes"       aria-pressed="false">☕ Coffee</button>
    <button class="cat-pill" data-cat="beaches_parks"      aria-pressed="false">🏖 Beaches &amp; Parks</button>
    <button class="cat-pill" data-cat="shopping"           aria-pressed="false">🛍 Shopping</button>
    <button class="cat-pill" data-cat="spas_wellness"      aria-pressed="false">💆 Spas &amp; Wellness</button>
    <button class="cat-pill" data-cat="museums_art"        aria-pressed="false">🎨 Museums &amp; Art</button>
